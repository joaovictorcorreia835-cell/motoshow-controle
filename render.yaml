services:
  - type: web
    name: motoshow-controle
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash render-start.sh
    healthCheckPath: /healthz
    healthCheckInterval: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: motoshow-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_NAME
        value: Gestão Motoshow
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@motoshow.local
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: motoshow-db
    plan: free
    databaseName: motoshow
    user: motoshow
