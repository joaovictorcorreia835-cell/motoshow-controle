{% extends 'base.html' %}

{% block content %}
  <div class="text-center py-5">
    <h1 class="display-5">Motoshow Controle</h1>
    <p class="lead">Sistema de gestão de eventos com autenticação, banco de dados e painel administrativo.</p>
    <div class="d-flex justify-content-center gap-2 mt-4">
      {% if current_user.is_authenticated %}
        <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">Acessar Dashboard</a>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-outline-secondary" type="submit">Sair</button>
        </form>
      {% else %}
        <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Entrar</a>
      {% endif %}
    </div>
  </div>
{% endblock %}
